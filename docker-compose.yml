services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  prisma:
    image: node:18
    working_dir: /app
    volumes:
      - ./prisma:/app/prisma
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/energy_db
    command: ["npx", "prisma", "migrate", "dev", "--name", "init"]
    depends_on:
      - postgres


  backend:
    build: ./backend
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/energy_db
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
